<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Nuestro camino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep: #05060F;
    --mid: #0B0E22;
    --star: #FFFFFF;
    --accent: #FF5A6B;
    --accent-soft: rgba(255,90,107,0.35);
    --gold: #FFD166;
    --text: #F3F2FA;
    --text-dim: #9B9CB8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{ margin:0; overscroll-behavior:none; }
  body{
    background: radial-gradient(ellipse at 50% 10%, var(--mid) 0%, var(--deep) 60%);
    color: var(--text);
    font-family:'Quicksand', sans-serif;
    min-height:100vh;
    min-height:100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    position:relative;
    overflow-x:hidden;
  }

  .stars-layer{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .vignette{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.45) 100%);
  }
  .bg-star{ position:absolute; background: var(--star); border-radius:50%; animation: twinkle ease-in-out infinite; }
  .bg-star.warm{ background: var(--gold); }
  @keyframes twinkle{ 0%,100%{opacity:0.15;} 50%{opacity:0.9;} }

  header{
    position:relative; z-index:1; text-align:center;
    padding: 44px 20px 6px;
  }
  .chapter-tag{
    font-size: 12px; letter-spacing:4px; text-transform:uppercase;
    color: var(--gold); font-weight:700;
  }
  header h1{
    font-family:'Cormorant Garamond', serif; font-weight:600;
    font-size: 44px; margin: 8px 0 4px; line-height:1;
    background: linear-gradient(120deg, #FFFFFF, var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size: 16px;
    color: var(--text-dim); margin: 0; max-width: 280px; margin-inline:auto;
  }

  .path-wrap{
    position:relative; z-index:1;
    max-width: 460px; margin: 20px auto 0;
    padding-bottom: 30px;
  }
  .path-wrap svg{ position:absolute; top:0; left:0; width:100%; height:100%; overflow:visible; }
  .link-line{
    fill:none; stroke: var(--accent); stroke-width: 2;
    stroke-linecap: round; opacity: 0.55;
    filter: drop-shadow(0 0 4px var(--accent-soft));
  }

  .photo-float{
    position:absolute;
    width: 84px;
    padding: 5px 5px 10px;
    background: #f7f3ee;
    border-radius: 2px;
    box-shadow: 0 12px 26px -6px rgba(0,0,0,0.6), 0 0 22px rgba(255,209,102,0.16);
    z-index: 1;
    animation: floatSlow 7s ease-in-out infinite;
    pointer-events: none;
  }
  .photo-float img{
    display:block; width:100%; height:64px; object-fit:cover; border-radius:1px;
  }
  @keyframes floatSlow{
    0%, 100%{ transform: translateY(0px) rotate(var(--tilt,-6deg)); }
    50%{ transform: translateY(-8px) rotate(var(--tilt,-6deg)); }
  }

  .stop{
    position:absolute;
    transform: translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    cursor:pointer; z-index:2;
    width: 120px;
  }
  .stop .glow{
    position:absolute; width:54px; height:54px; border-radius:50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
  }
  .stop .dot{
    width: 18px; height:18px; border-radius:50%;
    background: var(--gold); border: 2px solid var(--gold);
    box-shadow: 0 0 14px 3px var(--accent-soft);
    position:relative; z-index:1;
  }
  .stop.latest .dot{
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 18px 5px rgba(255,90,107,0.55);
    animation: beat 2.2s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ box-shadow: 0 0 14px 3px rgba(255,90,107,0.45); }
    50%{ box-shadow: 0 0 24px 8px rgba(255,90,107,0.7); }
  }
  .stop .label{
    margin-top: 10px;
    font-size: 12px; font-weight:700; letter-spacing:1px;
    color: var(--gold); white-space:nowrap;
  }
  .stop.latest .label{ color: var(--accent); }
  .stop .badge{
    margin-top: 2px;
    font-size: 9px; letter-spacing:1.5px; text-transform:uppercase;
    color: #fff; background: var(--accent);
    padding: 2px 7px; border-radius: 999px;
    opacity:0; transform: scale(0.8);
    animation: popIn 0.4s ease 0.3s forwards;
  }
  @keyframes popIn{ to{ opacity:1; transform:scale(1); } }

  .stop.locked .dot{
    background: transparent; border: 2px dashed #4A4B66;
    box-shadow:none;
  }
  .stop.locked .glow{ display:none; }
  .stop.locked .label{ color: #6B6C86; }
  .stop.locked .lock-icon{
    position:absolute; font-size:9px; color:#6B6C86;
  }

  .hint{
    position:relative; z-index:1; text-align:center;
    font-size: 13px; color: var(--text-dim);
    margin: 4px 0 6px; padding: 0 30px;
  }

  .sheet-backdrop{
    position:fixed; inset:0; background: rgba(5,6,15,0.6);
    backdrop-filter: blur(2px); opacity:0; pointer-events:none;
    transition: opacity 0.3s ease; z-index:10;
  }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    background: linear-gradient(180deg, #14172E, #0B0D1E);
    border-top: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px 22px 0 0;
    padding: 26px 26px calc(30px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(.22,1,.36,1);
    z-index:11; max-width: 460px; margin: 0 auto; max-height: 82vh; overflow-y: auto;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .sheet.show{ transform: translateY(0); }
  .sheet .drag{ width:36px; height:4px; border-radius:2px; background: rgba(255,255,255,0.2); margin: 0 auto 18px; }
  .sheet .month-tag{ font-size: 12px; letter-spacing:3px; text-transform:uppercase; color: var(--gold); font-weight:700; margin-bottom: 12px; }
  .sheet p{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size: 20px; line-height:1.5; margin: 0 0 22px; color: var(--text); }
  .sheet button{ width:100%; background: var(--accent); color:#fff; border:none; padding: 14px; border-radius: 14px; font-family:'Quicksand', sans-serif; font-weight:700; font-size: 15px; cursor:pointer; }

  .final-card{
    position:relative; z-index:1; text-align:center;
    max-width: 420px; margin: 10px auto 0; padding: 20px 24px 50px;
  }
  .final-heart{ font-size: 34px; margin-bottom: 8px; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  .final-card p{
    font-family:'Cormorant Garamond', serif; font-style: italic; font-size: 17px;
    color: var(--text-dim); line-height:1.6; margin: 0;
  }
  .signature{
    margin-top: 14px; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gold);
  }
</style>
</head>
<body>

<div class="stars-layer" id="starsLayer"></div>
<div class="vignette"></div>

<header>
  <span class="chapter-tag">Nuestra historia</span>
  <h1>Sara &amp; Efrén</h1>
  <p>Una historia que seguimos escribiendo juntos, mes a mes.</p>
</header>

<p class="hint">Toca cada parada para leerla.</p>

<div class="path-wrap" id="pathWrap">
  <svg id="linesSvg"></svg>
</div>

<div class="final-card">
  <div class="final-heart">&#10084;</div>
  <p>Y así seguimos, sumando páginas a esto nuestro. Que la historia no deje de escribirse.</p>
  <div class="signature">— Efrén</div>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="drag"></div>
  <div class="month-tag" id="sheetTag">MES</div>
  <p id="sheetText"></p>
  <button id="sheetClose">Cerrar</button>
</div>

const months = [
  {
    label: 'Mes 1',
    msg: 'Empezó sin que nos diéramos cuenta, como empiezan las cosas de verdad: una sonrisa que se quedó ahí más tiempo del necesario, unas ganas de seguir hablando que no se apagaron cuando debían. No hubo ningún plan, solo la certeza tranquila de que quería saber más de ti.',
    photos: [PHOTO_M1A, PHOTO_M1B]
  },
  {
    label: 'Mes 2',
    msg: 'Aprendimos a reírnos de todo, hasta de nosotros mismos, y fue justo ahí, en medio de esas tonterías, cuando empezó a sentirse como algo que merecía la pena cuidar. Cada día contigo se volvía un poco más nuestro.',
    photos: [PHOTO_M2A, PHOTO_M2B]
  },
  {
    label: 'Mes 3',
    msg: 'Me marché unos días a Valladolid, y descubrí algo que no esperaba: que la distancia, por corta que fuera, se notaba. Al volver no paré de buscarte, de querer contarte hasta lo más pequeño del día. No fue nada extraordinario, y sin embargo contigo hasta lo simple se sintió como algo que merecía guardarse.',
    photos: [PHOTO_M3A, PHOTO_M3B]
  },
  {
    label: 'Mes 4',
    msg: 'Llegó la vuelta a clase, con su rutina de siempre y sus horas que no avanzan, y habría sido un mes cualquiera si no fuera por ti. Contigo hasta el aburrimiento tiene gracia: un par de PEZ de Spider-Man y Gwen en plena calle, una foto en la que apenas sales entera y yo asomo detrás haciendo el tonto, una tarde de mascarilla de Minions. Nada que merezca un titular, y aun así es lo que más quiero guardar de este otoño.',
    photos: [PHOTO_M4A, PHOTO_M4B, PHOTO_M4C, PHOTO_M4D]
  },
  {
    label: 'Mes 5',
    locked: true,
    msg: 'Todavía no ha llegado... paciencia. Esta página se escribirá el mes que viene.'
  },
];

const pathWrap = document.getElementById('pathWrap');
const linesSvg = document.getElementById('linesSvg');
const backdrop = document.getElementById('backdrop');
const sheet = document.getElementById('sheet');
const sheetText = document.getElementById('sheetText');
const sheetTag = document.getElementById('sheetTag');
const sheetClose = document.getElementById('sheetClose');

const STEP = 148;
const TOPPAD = 50;
const pathHeight = TOPPAD * 2 + STEP * (months.length - 1);
pathWrap.style.height = pathHeight + 'px';

function xForIndex(i){
  const amp = 32;
  const t = i * 1.15;
  return 50 + amp * Math.sin(t);
}

const points = months.map((m, i) => ({
  x: xForIndex(i),
  y: TOPPAD + i * STEP
}));

linesSvg.setAttribute('viewBox', `0 0 100 ${pathHeight}`);
linesSvg.setAttribute('preserveAspectRatio', 'none');

for(let i = 0; i < points.length - 1; i++){
  const p1 = points[i], p2 = points[i+1];
  const midY = (p1.y + p2.y) / 2;
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('class','link-line');
  path.setAttribute('vector-effect','non-scaling-stroke');
  path.setAttribute('d', `M ${p1.x} ${p1.y} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`);
  linesSvg.appendChild(path);
}

months.forEach((m, i) => {
  const unlockedMonths = months.filter(x => !x.locked);
  const isLatest = !m.locked && i === unlockedMonths.length - 1;

  if(m.photos && m.photos.length){
    const side = (i % 2 === 0) ? 1 : -1;
    const offsets = (m.photos.length >= 4) ? [
      { dx: -104, dy: -34, tilt: '-6deg', delay: '0s' },
      { dx: 104,  dy: -44, tilt: '5deg',  delay: '1.2s' },
      { dx: -98,  dy: 48,  tilt: '4deg',  delay: '2.1s' },
      { dx: 102,  dy: 38,  tilt: '-5deg', delay: '0.6s' }
    ] : [
      { dx: -30 * side, dy: -34, tilt: '-7deg', delay: '0s' },
      { dx: 34 * side,  dy: 22,  tilt: '6deg',  delay: '1.4s' }
    ];
    m.photos.forEach((src, pi) => {
      const off = offsets[pi];
      const fig = document.createElement('div');
      fig.className = 'photo-float';
      fig.style.left = `calc(${points[i].x}% + ${off.dx}px)`;
      fig.style.top = (points[i].y + off.dy) + 'px';
      fig.style.setProperty('--tilt', off.tilt);
      fig.style.animationDelay = off.delay;
      fig.innerHTML = `<img src="${src}" alt="">`;
      pathWrap.appendChild(fig);
    });
  }

  const stop = document.createElement('div');
  stop.className = 'stop' + (isLatest ? ' latest' : '') + (m.locked ? ' locked' : '');
  stop.style.left = points[i].x + '%';
  stop.style.top = points[i].y + 'px';
  stop.innerHTML = `
    <div class="glow"></div>
    <div class="dot"></div>
    <span class="label">${m.label}</span>
    ${isLatest ? '<span class="badge">nuevo</span>' : ''}
    ${m.locked ? '<span class="lock-icon">&#128274;</span>' : ''}
  `;
  stop.addEventListener('click', () => {
    sheetTag.textContent = m.locked ? 'PRÓXIMAMENTE' : m.label.toUpperCase();
    sheetText.textContent = m.msg;
    backdrop.classList.add('show');
    sheet.classList.add('show');
  });
  pathWrap.appendChild(stop);
});

function closeSheet(){
  backdrop.classList.remove('show');
  sheet.classList.remove('show');
}
backdrop.addEventListener('click', closeSheet);
sheetClose.addEventListener('click', closeSheet);

const starsLayer = document.getElementById('starsLayer');
for(let i=0;i<60;i++){
  const s = document.createElement('div');
  s.className = 'bg-star' + (Math.random() < 0.2 ? ' warm' : '');
  const size = Math.random()*2 + 0.8;
  s.style.width = size+'px';
  s.style.height = size+'px';
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*100+'%';
  s.style.animationDuration = (2 + Math.random()*3)+'s';
  s.style.animationDelay = (Math.random()*4)+'s';
  starsLayer.appendChild(s);
}
</script>
</body>
